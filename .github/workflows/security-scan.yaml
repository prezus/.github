name: Security Scan
on:
  workflow_call:
    inputs:
      severity-threshold:
        description: 'Minimum severity to report (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)'
        type: string
        default: 'HIGH'
      create-issues:
        description: 'Create GitHub issues for new vulnerabilities'
        type: boolean
        default: true
      fail-on-vulns:
        description: 'Fail the workflow if vulnerabilities are found'
        type: boolean
        default: false
      notify-discord:
        description: 'Send Discord notification when vulnerabilities are found'
        type: boolean
        default: true
      runner:
        description: 'The runner to use for jobs'
        type: string
        default: 'arc-runner-security-scanner'
      image-ref:
        description: 'Docker image to scan (overrides Dockerfile build). Tag defaults to :latest if not specified'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write
jobs:
  detect-languages:
    name: Detect Languages
    runs-on: ${{ inputs.runner }}
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      rust-esp: ${{ steps.detect.outputs.rust-esp }}
      node: ${{ steps.detect.outputs.node }}
      go: ${{ steps.detect.outputs.go }}
      python: ${{ steps.detect.outputs.python }}
      dockerfile: ${{ steps.detect.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect project files
        id: detect
        run: |
          echo "rust=$([[ -f Cargo.toml ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "node=$([[ -f package.json ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "go=$([[ -f go.mod ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "python=$([[ -f requirements.txt || -f pyproject.toml || -f Pipfile ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "dockerfile=$([[ -f Dockerfile ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          # ESP Rust detection
          ESP_RUST=false
          if [[ -f Cargo.toml ]]; then
            if [[ -f .cargo/config.toml ]] && grep -qE "(xtensa|riscv32.*esp)" .cargo/config.toml 2>/dev/null; then
              ESP_RUST=true
            elif [[ -f rust-toolchain.toml ]] && grep -q "esp" rust-toolchain.toml 2>/dev/null; then
              ESP_RUST=true
            elif grep -qE "(esp-idf|esp-hal)" Cargo.toml 2>/dev/null; then
              ESP_RUST=true
            fi
          fi
          echo "rust-esp=$ESP_RUST" >> $GITHUB_OUTPUT
  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: '@${{ github.actor }}'
  rust-audit:
    name: Rust Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-languages
    if: needs.detect-languages.outputs.rust == 'true' && needs.detect-languages.outputs.rust-esp != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy Rust scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'rust-audit-results.sarif'
          severity: ${{ inputs.severity-threshold }},CRITICAL
          exit-code: ${{ inputs.fail-on-vulns && '1' || '0' }}
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'rust-audit-results.sarif'
          category: 'rust-security-audit'
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-audit-results
          path: rust-audit-results.sarif
  rust-esp-audit:
    name: Rust ESP Security Audit
    runs-on: ${{ inputs.runner }}
    container:
      image: espressif/idf-rust:latest
    needs: detect-languages
    if: needs.detect-languages.outputs.rust-esp == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy Rust ESP scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'rust-audit-results.sarif'
          severity: ${{ inputs.severity-threshold }},CRITICAL
          exit-code: ${{ inputs.fail-on-vulns && '1' || '0' }}
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'rust-audit-results.sarif'
          category: 'rust-esp-security-audit'
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-audit-results
          path: rust-audit-results.sarif
  node-audit:
    name: Node.js Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-languages
    if: needs.detect-languages.outputs.node == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect package manager
        id: pm
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [[ -f yarn.lock ]]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi
      - name: Install pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        run: npm install -g pnpm
      - name: Run npm audit
        if: steps.pm.outputs.manager == 'npm'
        run: |
          npm audit --json > npm-audit-results.json || true
          npm audit 2>&1 | tee npm-audit-results.txt || true
      - name: Run pnpm audit
        if: steps.pm.outputs.manager == 'pnpm'
        run: |
          pnpm audit --json > npm-audit-results.json || true
          pnpm audit 2>&1 | tee npm-audit-results.txt || true
      - name: Run yarn audit
        if: steps.pm.outputs.manager == 'yarn'
        run: |
          yarn audit --json > npm-audit-results.json || true
          yarn audit 2>&1 | tee npm-audit-results.txt || true
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: node-audit-results
          path: |
            npm-audit-results.json
            npm-audit-results.txt
  go-audit:
    name: Go Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-languages
    if: needs.detect-languages.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          govulncheck -json ./... > govulncheck-results.json || true
          govulncheck ./... 2>&1 | tee govulncheck-results.txt || true
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: go-audit-results
          path: |
            govulncheck-results.json
            govulncheck-results.txt
  python-audit:
    name: Python Security Audit
    runs-on: ${{ inputs.runner }}
    needs: detect-languages
    if: needs.detect-languages.outputs.python == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt --format json > pip-audit-results.json || true
            pip-audit -r requirements.txt 2>&1 | tee pip-audit-results.txt || true
          elif [[ -f pyproject.toml ]]; then
            pip-audit --format json > pip-audit-results.json || true
            pip-audit 2>&1 | tee pip-audit-results.txt || true
          fi
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-results
          path: |
            pip-audit-results.json
            pip-audit-results.txt
  docker-scan:
    name: Docker Image Scan
    runs-on: ${{ inputs.runner }}
    needs: detect-languages
    if: needs.detect-languages.outputs.dockerfile == 'true' || inputs.image-ref != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: inputs.image-ref == ''
      - name: Pull or build image
        id: image
        run: |
          if [[ -n "${{ inputs.image-ref }}" ]]; then
            REF="${{ inputs.image-ref }}"
            # Add :latest if no tag specified
            if [[ "$REF" != *":"* ]]; then
              REF="${REF}:latest"
            fi
            echo "ref=$REF" >> $GITHUB_OUTPUT
            # Pull image (uses cache if unchanged)
            docker pull "$REF"
          else
            echo "ref=${{ github.repository }}:scan" >> $GITHUB_OUTPUT
            docker build -t ${{ github.repository }}:scan .
          fi
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.image.outputs.ref }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: ${{ inputs.severity-threshold }},CRITICAL
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker-image'
  create-issue:
    name: Create Issue for Vulnerabilities
    runs-on: ${{ inputs.runner }}
    needs: [gitleaks, rust-audit, rust-esp-audit, node-audit, go-audit, python-audit, docker-scan]
    if: always() && inputs.create-issues
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-results
        continue-on-error: true
      - name: Check for vulnerabilities and create issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let vulnerabilities = [];
            const resultsDir = 'scan-results';
            
            // Check if results directory exists
            if (!fs.existsSync(resultsDir)) {
              console.log('No scan results found');
              return;
            }
            
            // Check Rust audit results (SARIF from Trivy)
            const rustPath = path.join(resultsDir, 'rust-audit-results', 'rust-audit-results.sarif');
            if (fs.existsSync(rustPath)) {
              try {
                const rust = JSON.parse(fs.readFileSync(rustPath, 'utf8'));
                const runs = rust.runs || [];
                for (const run of runs) {
                  const results = run.results || [];
                  for (const result of results) {
                    if (result.level === 'error' || result.level === 'warning') {
                      vulnerabilities.push({
                        tool: 'Trivy (Rust)',
                        id: result.ruleId,
                        message: result.message?.text || 'Unknown vulnerability',
                        severity: result.level === 'error' ? 'HIGH/CRITICAL' : 'MEDIUM'
                      });
                    }
                  }
                }
              } catch (e) {
                console.log('Error parsing Rust audit results:', e.message);
              }
            }
            
            // Check npm audit results
            const npmPath = path.join(resultsDir, 'node-audit-results', 'npm-audit-results.txt');
            if (fs.existsSync(npmPath)) {
              const content = fs.readFileSync(npmPath, 'utf8');
              if (content.includes('high') || content.includes('critical') || content.includes('moderate')) {
                vulnerabilities.push({
                  tool: 'npm/pnpm/yarn audit',
                  id: 'NPM',
                  message: 'Node.js dependency vulnerabilities detected',
                  severity: 'See node-audit-results artifact'
                });
              }
            }
            
            // Check govulncheck results
            const goPath = path.join(resultsDir, 'go-audit-results', 'govulncheck-results.txt');
            if (fs.existsSync(goPath)) {
              const content = fs.readFileSync(goPath, 'utf8');
              if (content.includes('Vulnerability') || content.includes('GO-')) {
                vulnerabilities.push({
                  tool: 'govulncheck',
                  id: 'GO',
                  message: 'Go dependency vulnerabilities detected',
                  severity: 'See go-audit-results artifact'
                });
              }
            }
            
            // Check pip-audit results
            const pipPath = path.join(resultsDir, 'python-audit-results', 'pip-audit-results.txt');
            if (fs.existsSync(pipPath)) {
              const content = fs.readFileSync(pipPath, 'utf8');
              if (content.includes('PYSEC-') || content.includes('found')) {
                vulnerabilities.push({
                  tool: 'pip-audit',
                  id: 'PYSEC',
                  message: 'Python dependency vulnerabilities detected',
                  severity: 'See python-audit-results artifact'
                });
              }
            }
            
            if (vulnerabilities.length === 0) {
              console.log('No vulnerabilities found');
              return;
            }
            
            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });
            
            const existingIssue = issues.data.find(i => i.title.includes('Security Vulnerabilities Detected'));
            
            const issueBody = `## Security Scan Results
            
            **Scan Date:** ${new Date().toISOString()}
            **Commit:** ${context.sha}
            **Branch:** ${context.ref}
            **Workflow Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            ### Vulnerabilities Found
            
            | Tool | ID | Severity | Details |
            |------|-----|----------|---------|
            ${vulnerabilities.map(v => `| ${v.tool} | ${v.id} | ${v.severity} | ${v.message} |`).join('\n')}
            
            ### Next Steps
            
            1. Review the detailed scan results in the [workflow artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            2. Check the [Security tab](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security) for SARIF results
            3. Update vulnerable dependencies or apply patches
            4. Close this issue once all vulnerabilities are addressed
            
            ---
            *This issue was automatically created by the security scanning workflow.*
            `;
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Updated Scan Results\n\n${issueBody}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Security Vulnerabilities Detected',
                body: issueBody,
                labels: ['security', 'automated']
              });
              console.log(`Created new issue #${newIssue.data.number}`);
            }
  pr-comment:
    name: Comment on PR
    runs-on: ${{ inputs.runner }}
    needs: [gitleaks, rust-audit, rust-esp-audit, node-audit, go-audit, python-audit, docker-scan]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-results
        continue-on-error: true
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let summary = [];
            const resultsDir = 'scan-results';
            
            // Check each scan result
            const checks = [
              { name: 'Rust Audit', artifact: 'rust-audit-results', file: 'rust-audit-results.sarif' },
              { name: 'Node Audit', artifact: 'node-audit-results', file: 'npm-audit-results.txt' },
              { name: 'Go Vulncheck', artifact: 'go-audit-results', file: 'govulncheck-results.txt' },
              { name: 'Pip Audit', artifact: 'python-audit-results', file: 'pip-audit-results.txt' }
            ];
            
            for (const check of checks) {
              const filePath = path.join(resultsDir, check.artifact, check.file);
              if (fs.existsSync(filePath)) {
                summary.push(`| ${check.name} | ✅ Completed | See artifacts |`);
              }
            }
            
            if (summary.length === 0) {
              summary.push('| No language-specific scans | ℹ️ | Only universal scans ran |');
            }
            
            const body = `## 🔒 Security Scan Summary
            
            | Scanner | Status | Details |
            |---------|--------|---------|
            ${summary.join('\n')}
            
            **Full Results:**
            - 📊 [Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - 🔐 [Security Tab](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security)
            
            ---
            *Scanned at commit ${context.sha.substring(0, 7)}*
            `;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('Security Scan Summary')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
  discord-notify:
    name: Discord Notification
    runs-on: ${{ inputs.runner }}
    needs: [gitleaks, rust-audit, rust-esp-audit, node-audit, go-audit, python-audit, docker-scan]
    if: always() && inputs.notify-discord
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-results
        continue-on-error: true
      - name: Check for vulnerabilities and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
        run: |
          # Skip if webhook is not configured
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "Discord webhook not configured, skipping notification"
            exit 0
          fi
          
          VULNS_FOUND=false
          VULN_SUMMARY=""
          
          # Check Rust audit results (SARIF)
          if [[ -f scan-results/rust-audit-results/rust-audit-results.sarif ]]; then
            RUST_ISSUES=$(jq -r '[.runs[].results[] | select(.level == "error" or .level == "warning")] | length' scan-results/rust-audit-results/rust-audit-results.sarif 2>/dev/null || echo "0")
            if [[ "$RUST_ISSUES" -gt 0 ]]; then
              VULNS_FOUND=true
              VULN_SUMMARY="${VULN_SUMMARY}Rust: ${RUST_ISSUES} issues\n"
            fi
          fi
          
          # Check npm audit results
          if [[ -f scan-results/node-audit-results/npm-audit-results.txt ]]; then
            if grep -qiE "(high|critical|moderate)" scan-results/node-audit-results/npm-audit-results.txt 2>/dev/null; then
              VULNS_FOUND=true
              VULN_SUMMARY="${VULN_SUMMARY}Node.js: vulnerabilities detected\n"
            fi
          fi
          
          # Check govulncheck results
          if [[ -f scan-results/go-audit-results/govulncheck-results.txt ]]; then
            if grep -qE "(Vulnerability|GO-)" scan-results/go-audit-results/govulncheck-results.txt 2>/dev/null; then
              VULNS_FOUND=true
              VULN_SUMMARY="${VULN_SUMMARY}Go: vulnerabilities detected\n"
            fi
          fi
          
          # Check pip-audit results
          if [[ -f scan-results/python-audit-results/pip-audit-results.txt ]]; then
            if grep -qE "(PYSEC-|found)" scan-results/python-audit-results/pip-audit-results.txt 2>/dev/null; then
              VULNS_FOUND=true
              VULN_SUMMARY="${VULN_SUMMARY}Python: vulnerabilities detected\n"
            fi
          fi
          
          # Only send notification if vulnerabilities were found
          if [[ "$VULNS_FOUND" != "true" ]]; then
            echo "No vulnerabilities found, skipping Discord notification"
            exit 0
          fi
          
          # Build Discord embed payload
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          SHORT_COMMIT="${COMMIT:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SECURITY_URL="${{ github.server_url }}/${{ github.repository }}/security"
          
          # Escape newlines for JSON
          VULN_SUMMARY_ESCAPED=$(echo -e "$VULN_SUMMARY" | sed 's/$/\\n/' | tr -d '\n' | sed 's/\\n$//')
          
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "Security Vulnerabilities Detected",
              "color": 15158332,
              "fields": [
                {
                  "name": "Repository",
                  "value": "${REPO}",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${BRANCH}",
                  "inline": true
                },
                {
                  "name": "Commit",
                  "value": "${SHORT_COMMIT}",
                  "inline": true
                },
                {
                  "name": "Findings",
                  "value": "${VULN_SUMMARY_ESCAPED}",
                  "inline": false
                },
                {
                  "name": "Links",
                  "value": "[Workflow Run](${RUN_URL}) | [Security Tab](${SECURITY_URL})",
                  "inline": false
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          
          # Send to Discord
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          echo "Discord notification sent"
